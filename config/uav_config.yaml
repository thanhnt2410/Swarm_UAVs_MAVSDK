# Cấu hình cho các UAV, bao gồm chế độ hoạt động, kết nối và tham số bay.

# Chế độ hoạt động: "simulation" hoặc "real"
operation_mode: "simulation"

general:
  max_uav_count: 6
  rescue_uav_index: 6

# Các tham số pin PX4 được tự động áp dụng qua MAVSDK sau khi kết nối.
# Có thể cấu hình riêng theo operation_mode để tránh dùng nhầm thông số
# pin mô phỏng cho UAV thật. Các giá trị dưới đây tương ứng pin LiPo 4S
# 5000 mAh của model x500 (PX4 dùng 90% dung lượng danh định = 4500 mAh).
px4_parameters:
  simulation:
    BAT1_SOURCE: 0
    BAT1_N_CELLS: 4
    BAT1_CAPACITY: 4500.0
    BAT1_V_CHARGED: 4.05
    BAT1_V_EMPTY: 3.60
    BAT1_R_INTERNAL: 0.005
  real: {}

# Mô hình điện của pin/động cơ trong Gazebo. cmd/setup_px4.sh đọc phần này
# và cài MotorPowerSystem vào model x500 khi chuẩn bị PX4 trên máy mới.
gazebo_battery_model:
  model: "x500"
  battery_name: "linear_battery"
  joint_names:
    - "rotor_0_joint"
    - "rotor_1_joint"
    - "rotor_2_joint"
    - "rotor_3_joint"
  motor_constant: 8.54858e-06
  moment_constant: 0.016
  rotor_velocity_slowdown: 10.0
  motor_efficiency: 0.82
  static_power: 8.0
  capacity: 5.0
  initial_charge: 5.0
  open_circuit_voltage_constant_coef: 16.8
  open_circuit_voltage_linear_coef: -2.4
  resistance: 0.02
  smooth_current_tau: 0.5
  reset_charge_after_idle_s: 3.0
  idle_rotor_threshold_rad_s: 1.0

# Cấu hình cho từng UAV
uavs:
  - id: 1
    connection_allow: true
    streaming_enable: true
    detection_enable: true
    recording_enable: false
    init_alt: 13.0
    overwrite_params:
      MIS_TAKEOFF_ALT: 13
      MPC_TKO_SPEED: 2
      GND_SPEED_MAX: 2
      CURRENT_SPEED: 3
      RTL_AFTER_MS: true
    # Tùy chọn: ghi đè px4_parameters chung cho riêng UAV này.
    px4_parameters: {}

  - id: 2
    connection_allow: true
    streaming_enable: true
    detection_enable: true
    recording_enable: false
    init_alt: 13.0
    overwrite_params:
      MIS_TAKEOFF_ALT: 13
      MPC_TKO_SPEED: 2
      GND_SPEED_MAX: 2
      CURRENT_SPEED: 3
      RTL_AFTER_MS: true
    px4_parameters: {}

  - id: 3
    connection_allow: true
    streaming_enable: true
    detection_enable: true
    recording_enable: false
    init_alt: 13.0
    overwrite_params:
      MIS_TAKEOFF_ALT: 13
      MPC_TKO_SPEED: 2
      GND_SPEED_MAX: 2
      CURRENT_SPEED: 3
      RTL_AFTER_MS: true
    px4_parameters: {}

  - id: 4
    connection_allow: true
    streaming_enable: false
    detection_enable: false
    recording_enable: false
    init_alt: 13.0
    overwrite_params:
      MIS_TAKEOFF_ALT: 13
      MPC_TKO_SPEED: 2
      GND_SPEED_MAX: 2
      CURRENT_SPEED: 3
      RTL_AFTER_MS: true
    px4_parameters: {}

  - id: 5
    connection_allow: true
    streaming_enable: false
    detection_enable: false
    recording_enable: false
    init_alt: 13.0
    overwrite_params:
      MIS_TAKEOFF_ALT: 13
      MPC_TKO_SPEED: 2
      GND_SPEED_MAX: 2
      CURRENT_SPEED: 3
      RTL_AFTER_MS: true
    px4_parameters: {}

  - id: 6 # Rescue UAV
    connection_allow: true
    streaming_enable: true
    detection_enable: false
    recording_enable: false
    init_alt: 13.0
    overwrite_params:
      MIS_TAKEOFF_ALT: 13
      MPC_TKO_SPEED: 2
      GND_SPEED_MAX: 3
      CURRENT_SPEED: 20
      RTL_AFTER_MS: true
    px4_parameters: {}

# Cấu hình kết nối cho các chế độ
connection:
  simulation:
    protocol: "udpin"
    server_host: "127.0.0.1"
    base_server_port: 14540
    base_client_port: 50060
  real:
    protocol: "serial"
    base_client_port: 50060
    baudrate: 57600
    # Liệt kê cụ thể cổng serial cho từng UAV
    server_hosts:
      - "/dev/ttyACM0"
      - "/dev/ttyACM1"
      - "/dev/ttyACM2"
      - "/dev/ttyACM3"
      - "/dev/ttyACM4"
      - "/dev/ttyUSB0"
