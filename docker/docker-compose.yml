services:
  sw-uav:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTORCH_VARIANT: ${SW_UAV_TORCH_VARIANT:-cpu}
    image: sw-uav:latest
    container_name: sw-uav
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - QT_XCB_GL_INTEGRATION=xcb_glx
      - SW_UAV_TORCH_VARIANT=${SW_UAV_TORCH_VARIANT:-cpu}
      - SW_UAV_DOCKER=1
      - SW_UAV_IN_DOCKER=1
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/app
    working_dir: /app
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]


